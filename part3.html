            <a class="navbar-brand fw-bold" href="index.html">O</a>

                <span class="navbar-toggler-icon"></span>

            <div class="collapse navbar-collapse" id="navMenu">

    <main class="container my-5">
        <div class="card p-4 shadow-sm mb-4">
            <h2>Task 5: Mouse Events</h2>
            <p>Hover your mouse over the box below:</p>
            <div id="hoverBox" class="box-hover">
                Free Cash $$$(Hover Me!)
            </div>
        </div>

        <div class="card p-4 shadow-sm mb-4">
            <h2>Task 6: Keyboard Events</h2>
            <div class="my-2">
                <label for="textInput" class="form-label">Type something:</label>
                <input type="text" id="textInput" class="form-control" placeholder="Start typing...">
            </div>
            <p class="mt-2">Live output: <span id="liveOutput" class="fw-bold"></span></p>
        </div>

        <div class="card p-4 shadow-sm">
            <h2>Task 7: Simple Calculator</h2>
            <div class="row g-2 my-2">
                <div class="col-md-6">
                    <input type="number" id="calcNum1" class="form-control" placeholder="First number">
                </div>
                <div class="col-md-6">
                    <input type="number" id="calcNum2" class="form-control" placeholder="Second number">
                </div>
            </div>

            <div class="my-3">
                <button id="addBtn" class="btn btn-primary">+</button>
                <button id="subBtn" class="btn btn-secondary">-</button>
                <button id="mulBtn" class="btn btn-success">*</button>
                <button id="divBtn" class="btn btn-danger">/</button>
            </div>

            <h4>Result: <span id="calcResult">0</span></h4>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <p class="mb-0">made by Oleksandr</p>
